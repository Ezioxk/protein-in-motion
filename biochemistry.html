<script>
'use strict';
const TOPICS=[
  {
    "id": "classification",
    "ch": 2,
    "group": 0,
    "title": "分类与含氮量",
    "section": "2.1",
    "html": "<p>蛋白质由氨基酸按一定顺序通过肽键连接，并形成特定空间构象。</p><div class=\"table-wrap\"><table><thead><tr><th>依据</th><th>类型</th></tr></thead><tbody><tr><td>外形</td><td>球状蛋白质、纤维状蛋白质</td></tr><tr><td>化学组成</td><td>简单蛋白质、结合蛋白质</td></tr><tr><td>功能</td><td>催化、运输、贮存、运动、防御、调节、结构支持</td></tr></tbody></table></div><div class=\"formula\">蛋白质含量 ≈ 含氮量 × 6.25</div><p class=\"note\">蛋白质平均含氮约16%，1 ÷ 0.16 = 6.25。6.25是通用估算系数，不是所有蛋白质的精确系数。</p>",
    "quiz": {
      "q": "按通用系数估算，样品含氮量为2.0 g，蛋白质约为多少？",
      "options": [
        "3.2 g",
        "6.25 g",
        "12.5 g",
        "16.0 g"
      ],
      "answer": 2,
      "explanation": "2.0 g × 6.25 = 12.5 g。换算的依据是蛋白质平均含氮约16%。"
    }
  },
  {
    "id": "amino-structure",
    "ch": 2,
    "group": 1,
    "title": "氨基酸基本结构",
    "section": "2.2",
    "html": "<div class=\"formula\">H₂N—CH(R)—COOH</div><ul><li>α-碳连接氨基、羧基、氢原子和R基团；R基团决定不同氨基酸的主要差别。</li><li>甘氨酸（Gly）的R为H，无手性碳。</li><li>常见蛋白质中的手性氨基酸为L型。</li><li>脯氨酸（Pro）的侧链与氨基氮连接成环。</li><li>20种常见蛋白质氨基酸之外，另有硒代半胱氨酸、吡咯赖氨酸。</li></ul>",
    "quiz": {
      "q": "哪一种氨基酸没有手性碳原子？",
      "options": [
        "丙氨酸 Ala",
        "甘氨酸 Gly",
        "丝氨酸 Ser",
        "缬氨酸 Val"
      ],
      "answer": 1,
      "explanation": "甘氨酸的侧链为H，α-碳上有两个相同的氢原子，所以不是手性碳。"
    }
  },
  {
    "id": "amino-types",
    "ch": 2,
    "group": 1,
    "title": "20种氨基酸分类",
    "section": "2.2",
    "html": "<div class=\"table-wrap\"><table><thead><tr><th>类型</th><th>氨基酸</th></tr></thead><tbody><tr><td>非极性</td><td>Gly 甘氨酸 · Ala 丙氨酸 · Val 缬氨酸 · Leu 亮氨酸 · Ile 异亮氨酸 · Met 蛋氨酸 · Pro 脯氨酸 · Phe 苯丙氨酸 · Trp 色氨酸</td></tr><tr><td>极性不带电</td><td>Ser 丝氨酸 · Thr 苏氨酸 · Cys 半胱氨酸 · Tyr 酪氨酸 · Asn 天冬酰胺 · Gln 谷氨酰胺</td></tr><tr><td>酸性</td><td>Asp 天冬氨酸 · Glu 谷氨酸</td></tr><tr><td>碱性</td><td>Lys 赖氨酸 · Arg 精氨酸 · His 组氨酸</td></tr></tbody></table></div><ul><li>芳香族：Phe、Tyr、Trp。</li><li>含硫：Cys、Met；能形成二硫键的是Cys。</li><li>Gly、Pro容易出现在β转角中。</li></ul><p class=\"note\">按提纲的侧链性质分类；实际电荷取决于pH，His并非在所有条件下都带正电。</p>",
    "quiz": {
      "q": "下列哪一组都是含硫氨基酸？",
      "options": [
        "Ser、Thr",
        "Asp、Glu",
        "Phe、Tyr",
        "Cys、Met"
      ],
      "answer": 3,
      "explanation": "半胱氨酸Cys与蛋氨酸Met含硫。Cys的巯基可以氧化形成二硫键。"
    }
  },
  {
    "id": "charge",
    "ch": 2,
    "group": 1,
    "title": "两性解离与电泳",
    "section": "2.2",
    "html": "<p>氨基酸同时含有可供出质子的基团和可接受质子的基团，表现为两性解离。<strong>等电点pI是平均净电荷为零时的pH。</strong></p><div class=\"table-wrap\"><table><thead><tr><th>条件</th><th>平均净电荷</th><th>电泳方向</th></tr></thead><tbody><tr><td>pH ＜ pI</td><td>正</td><td>阴极（−）</td></tr><tr><td>pH = pI</td><td>零</td><td>基本不移动</td></tr><tr><td>pH ＞ pI</td><td>负</td><td>阳极（＋）</td></tr></tbody></table></div><div class=\"formula\">pH升高 → 逐步失去H⁺ → 净电荷趋向更负</div><p class=\"note\">净电荷为零不等于没有带电基团；两性离子可同时含正、负电荷。</p>",
    "quiz": {
      "q": "某蛋白质pI = 6.0，在pH = 8.0的缓冲液中通常向哪里迁移？",
      "options": [
        "阴极，因为带正电",
        "阳极，因为带负电",
        "不移动，因为电中性",
        "无法由pH和pI判断"
      ],
      "answer": 1,
      "explanation": "pH > pI，蛋白质平均净电荷为负，电泳时向阳极（正极）移动。"
    }
  },
  {
    "id": "pi",
    "ch": 2,
    "group": 1,
    "title": "等电点计算",
    "section": "2.2",
    "html": "<div class=\"formula\">pI =（pKₐ₁ + pKₐ₂）÷ 2</div><p>关键是选出<strong>夹住净电荷为零形式</strong>的两个pKₐ。</p><div class=\"table-wrap\"><table><thead><tr><th>类型</th><th>所取pKₐ</th></tr></thead><tbody><tr><td>无可解离侧链</td><td>α-羧基与α-氨基的pKₐ</td></tr><tr><td>Asp、Glu等酸性氨基酸</td><td>两个较小的pKₐ</td></tr><tr><td>Lys、Arg、His等碱性氨基酸</td><td>两个较大的pKₐ</td></tr></tbody></table></div><h3>赖氨酸示例</h3><div class=\"formula\">pI =（8.95 + 10.53）÷ 2 = 9.74</div><p class=\"note\">先列出随pH上升出现的净电荷，再圈出中性形式两侧的解离步骤，比机械套公式更可靠。</p>",
    "quiz": {
      "q": "某酸性氨基酸的三个pKₐ为2.1、3.9、9.8，pI为多少？",
      "options": [
        "6.85",
        "5.95",
        "3.00",
        "7.90"
      ],
      "answer": 2,
      "explanation": "酸性氨基酸的净电荷零形式夹在前两次解离之间，因此pI = (2.1 + 3.9) ÷ 2 = 3.00。"
    }
  },
  {
    "id": "amino-reactions",
    "ch": 2,
    "group": 1,
    "title": "氨基酸化学反应",
    "section": "2.2",
    "html": "<div class=\"table-wrap\"><table><thead><tr><th>反应或试剂</th><th>现象／用途</th></tr></thead><tbody><tr><td>茚三酮</td><td>多数氨基酸呈蓝紫色</td></tr><tr><td>Pro＋茚三酮</td><td>黄色</td></tr><tr><td>DNFB</td><td>Sanger法鉴定N端</td></tr><tr><td>PITC</td><td>Edman降解，逐个鉴定N端残基</td></tr><tr><td>巯基氧化</td><td>两个Cys形成二硫键</td></tr></tbody></table></div><div class=\"formula\">2 R—SH → R—S—S—R（氧化）</div>",
    "quiz": {
      "q": "用于Edman降解的试剂是？",
      "options": [
        "PITC",
        "DNFB",
        "SDS",
        "CNBr"
      ],
      "answer": 0,
      "explanation": "PITC用于Edman降解，可从N端逐个鉴定氨基酸；DNFB用于Sanger端基分析。"
    }
  },
  {
    "id": "peptide",
    "ch": 2,
    "group": 2,
    "title": "肽键与肽链方向",
    "section": "2.3",

function updateProgress(){const ts=TOPICS.filter(t=>t.ch===chapter),n=ts.filter(t=>attempts[t.id]===t.quiz.answer).length;$('progress').textContent=`已答对 ${n} / ${ts.length}`;document.querySelectorAll('.map-node.topic').forEach(b=>{const t=TOPICS.find(t=>t.id===b.dataset.id);b.classList.toggle('done',attempts[t.id]===t.quiz.answer);});}
function setScale(v,center=true){const old=scale,cx=(viewport.scrollLeft+viewport.clientWidth/2)/old,cy=(viewport.scrollTop+viewport.clientHeight/2)/old;scale=Math.max(.35,Math.min(1.5,v));$('surface').style.width=`${graphWidth*scale}px`;$('surface').style.height=`${graphHeight*scale}px`;$('canvas').style.transform=`scale(${scale})`;$('zoom-value').textContent=Math.round(scale*100)+'%';if(center){viewport.scrollLeft=cx*scale-viewport.clientWidth/2;viewport.scrollTop=cy*scale-viewport.clientHeight/2;}}
function fit(all=true){fitMode=all?'all':'width';setScale(all?Math.min((viewport.clientWidth-26)/graphWidth,(viewport.clientHeight-20)/graphHeight,1):Math.min((viewport.clientWidth-24)/graphWidth,1),false);viewport.scrollLeft=0;viewport.scrollTop=0;}
function drawMap(){if(matchMedia('(max-width:760px)').matches){drawMobileMap();return;}graphWidth=1010;$('canvas').style.width=graphWidth+'px';const conf=CHAPTERS[chapter];const buckets=conf.groups.map((_,i)=>TOPICS.filter(t=>t.ch===chapter&&t.group===i));const rowHeights=[0,1,2].map(i=>Math.max(buckets[i].length,buckets[i+3].length)*53+64);graphHeight=rowHeights.reduce((a,b)=>a+b,0)+40;$('canvas').style.height=graphHeight+'px';const rowCenters=[];let y=20;rowHeights.forEach(h=>{rowCenters.push(y+h/2);y+=h;});const rootY=graphHeight/2;let paths='',html=`<button class="map-node root" style="left:505px;top:${rootY}px" data-root="true"><small>第${chapter===2?'二':'三'}章</small>${conf.name}</button>`;
conf.groups.forEach((name,i)=>{const left=i<3,row=i%3,by=rowCenters[row],bx=left?327:683,tx=left?112:898,items=buckets[i],start=by-(items.length-1)*53/2;paths+=`<path class="edge" d="M${left?438:572},${rootY} C${left?395:615},${rootY} ${left?414:596},${by} ${left?395:615},${by}"/>`;html+=`<button class="map-node branch" style="left:${bx}px;top:${by}px" data-group="${i}"><small>${conf.sections[i]}</small>${name}</button>`;items.forEach((t,j)=>{const ty=start+j*53;paths+=`<path class="edge outer" d="M${left?259:751},${by} C${left?233:777},${by} ${left?232:778},${ty} ${left?208:802},${ty}"/>`;html+=`<button class="map-node topic${selected===t.id?' selected':''}" style="left:${tx}px;top:${ty}px" data-id="${t.id}" aria-pressed="${selected===t.id}">${t.title}</button>`;});});$('connectors').innerHTML=paths;$('connectors').setAttribute('viewBox',`0 0 1010 ${graphHeight}`);$('nodes').innerHTML=html;updateProgress();requestAnimationFrame(()=>{if(fitMode)fit(fitMode==='all');else setScale(scale,false);});}
function drawMobileMap(){graphWidth=440;const conf=CHAPTERS[chapter];let y=140;let paths='',html=`<button class="map-node root" style="left:220px;top:49px;min-height:70px;padding:8px" data-root="true"><small>第${chapter===2?'二':'三'}章</small>${conf.name}</button>`;conf.groups.forEach((name,i)=>{const ts=TOPICS.filter(t=>t.ch===chapter&&t.group===i),by=y+(ts.length-1)*55/2;paths+=`<path class="edge" d="M220,87 L20,87 L20,${by} L28,${by}"/>`;html+=`<button class="map-node branch" style="left:96px;top:${by}px;width:136px" data-group="${i}"><small>${conf.sections[i]}</small>${name}</button>`;ts.forEach((t,j)=>{const ty=y+j*55;paths+=`<path class="edge outer" d="M164,${by} C190,${by} 184,${ty} 205,${ty}"/>`;html+=`<button class="map-node topic${selected===t.id?' selected':''}" style="left:315px;top:${ty}px;width:220px;font-size:16px;min-height:49px" data-id="${t.id}" aria-pressed="${selected===t.id}">${t.title}</button>`;});y+=ts.length*55+48;});graphHeight=y-15;$('canvas').style.width=graphWidth+'px';$('canvas').style.height=graphHeight+'px';$('connectors').innerHTML=paths;$('connectors').setAttribute('viewBox',`0 0 ${graphWidth} ${graphHeight}`);$('nodes').innerHTML=html;updateProgress();requestAnimationFrame(()=>{if(fitMode)fit(fitMode==='all');else setScale(scale,false);});}
function setChapter(ch){chapter=ch;document.querySelectorAll('.tab').forEach(b=>{const active=Number(b.dataset.ch)===chapter;b.classList.toggle('active',active);b.setAttribute('aria-pressed',active);});drawMap();}
function openReader(){if(!reader.contains(document.activeElement))lastFocus=document.activeElement;reader.classList.add('open');document.body.classList.add('reading');reader.scrollTop=0;if(matchMedia('(max-width:760px)').matches){reader.setAttribute('role','dialog');reader.setAttribute('aria-modal','true');document.querySelector('.top').inert=true;document.querySelector('.map-section').inert=true;$('close-reader').focus();}}
function closeReader(){reader.classList.remove('open');document.body.classList.remove('reading');reader.removeAttribute('role');reader.removeAttribute('aria-modal');document.querySelector('.top').inert=false;document.querySelector('.map-section').inert=false;if(lastFocus?.isConnected)lastFocus.focus();}
function selectTopic(id,open=true,route=true){const t=TOPICS.find(x=>x.id===id);if(!t)return;selected=id;if(chapter!==t.ch)setChapter(t.ch);else if(!$('nodes').childElementCount)drawMap();document.querySelectorAll('.map-node.topic').forEach(b=>{b.classList.toggle('selected',b.dataset.id===id);b.setAttribute('aria-pressed',b.dataset.id===id);});$('breadcrumb').textContent=`第${t.ch===2?'二':'三'}章 · ${CHAPTERS[t.ch].groups[t.group]} · ${t.section}`;$('lesson').innerHTML=`<article><h2>${t.title}</h2>${t.html}<p class="source">来源：本次对话复习提纲 · ${t.section}。练习为据此编写的巩固题。</p><section class="quiz" aria-label="巩固练习"><div class="quiz-header"><h3>巩固练习</h3><span>单项选择</span></div><p class="question">${t.quiz.q}</p><div class="options">${t.quiz.options.map((s,i)=>`<button class="option" data-answer="${i}"><span class="letter">${'ABCD'[i]}</span><span>${s}</span></button>`).join('')}</div><div id="feedback" class="feedback" aria-live="polite" hidden></div><div class="quiz-bottom"><button id="retry" hidden>重新作答</button><span></span><button class="next" id="next-topic">下一知识点 →</button></div></section></article>`;
$('lesson').querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>answer(t,Number(b.dataset.answer))));$('retry').onclick=()=>{delete attempts[t.id];try{localStorage.setItem('biochem-review-v1',JSON.stringify(attempts));}catch(e){}selectTopic(id,false,false);updateProgress();$('lesson').querySelector('.option').focus();};$('next-topic').onclick=()=>{const i=TOPICS.findIndex(x=>x.id===id);selectTopic(TOPICS[(i+1)%TOPICS.length].id);};if(Number.isInteger(attempts[t.id])&&attempts[t.id]>=0&&attempts[t.id]<t.quiz.options.length)showAnswer(t,attempts[t.id]);reader.scrollTop=0;if(open)openReader();if(route)history.pushState(null,'','#'+id);}
function showAnswer(t,index){const right=index===t.quiz.answer;$('lesson').querySelectorAll('.option').forEach((b,i)=>{b.disabled=true;b.classList.toggle('correct',i===t.quiz.answer);b.classList.toggle('wrong',i===index&&!right);if(i===t.quiz.answer)b.setAttribute('aria-label',`${'ABCD'[i]} ${t.quiz.options[i]}，正确答案`);else if(i===index)b.setAttribute('aria-label',`${'ABCD'[i]} ${t.quiz.options[i]}，你的答案，错误`);});const f=$('feedback');f.hidden=false;f.className='feedback'+(right?'':' wrong');f.innerHTML=`<strong>${right?'回答正确':'本题正确答案：'+ 'ABCD'[t.quiz.answer]}</strong><p>${t.quiz.explanation}</p>`;$('retry').hidden=false;}
function answer(t,index){record(t,index);showAnswer(t,index);}
function overview(group=null,open=false,route=true){selected=null;document.querySelectorAll('.map-node.topic').forEach(b=>{b.classList.remove('selected');b.setAttribute('aria-pressed','false');});const conf=CHAPTERS[chapter],ts=TOPICS.filter(t=>t.ch===chapter&&(group===null||t.group===group));$('breadcrumb').textContent=`第${chapter===2?'二':'三'}章 · ${group===null?'章节总览':conf.sections[group]}`;$('lesson').innerHTML=`<h2>${group===null?conf.name:conf.groups[group]}</h2><p class="overview-intro">${group===null?'从导图选择知识点，阅读后完成一道选择题。':'选择本分支的知识点。'}</p><div class="overview-items">${(group===null?conf.groups.map((g,i)=>`<button data-overview-group="${i}">${conf.sections[i]}　${g}<span>→</span></button>`):ts.map(t=>`<button data-overview-topic="${t.id}">${t.title}<span>→</span></button>`)).join('')}</div><p class="overview-count">${ts.length} 个知识点 · ${ts.length} 道巩固题</p><p class="source">内容来源：本次对话中整理的第二、三章复习提纲。</p>`;$('lesson').querySelectorAll('[data-overview-group]').forEach(b=>b.onclick=()=>overview(Number(b.dataset.overviewGroup),true));$('lesson').querySelectorAll('[data-overview-topic]').forEach(b=>b.onclick=()=>selectTopic(b.dataset.overviewTopic));reader.scrollTop=0;if(open)openReader();if(route)history.pushState(null,'','#chapter-'+chapter+(group===null?'':'-group-'+group));}
$('nodes').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.id)selectTopic(b.dataset.id);else if(b.dataset.group!==undefined)overview(Number(b.dataset.group),true);else overview(null,true);});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{selected=null;setChapter(Number(b.dataset.ch));overview();});
$('zoom-in').onclick=()=>{fitMode=false;setScale(scale+.15);};$('zoom-out').onclick=()=>{fitMode=false;setScale(scale-.15);};$('fit').onclick=()=>fit();$('readable').onclick=()=>{fitMode=false;setScale(1);};$('close-reader').onclick=closeReader;
let drag=null;viewport.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0||e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,l:viewport.scrollLeft,t:viewport.scrollTop};viewport.setPointerCapture(e.pointerId);viewport.classList.add('dragging');});viewport.addEventListener('pointermove',e=>{if(!drag)return;viewport.scrollLeft=drag.l-(e.clientX-drag.x);viewport.scrollTop=drag.t-(e.clientY-drag.y);});function endDrag(){drag=null;viewport.classList.remove('dragging');}viewport.addEventListener('pointerup',endDrag);viewport.addEventListener('pointercancel',endDrag);
function hideSearch(){$('search-results').hidden=true;$('search').setAttribute('aria-expanded','false');}
$('search').addEventListener('input',()=>{const q=$('search').value.trim().toLowerCase();if(!q){hideSearch();return;}const matches=TOPICS.filter(t=>(t.title+' '+t.section+' '+t.html.replace(/<[^>]+>/g,' ')).toLowerCase().includes(q));$('search-results').innerHTML=matches.length?matches.map(t=>`<button data-result="${t.id}">${escapeHTML(t.title)}<small>第${t.ch===2?'二':'三'}章 · ${t.section}</small></button>`).join(''):'<p>没有匹配的知识点</p>';$('search-results').hidden=false;$('search').setAttribute('aria-expanded','true');});$('search-results').addEventListener('click',e=>{const b=e.target.closest('[data-result]');if(!b)return;hideSearch();selectTopic(b.dataset.result);});$('search').addEventListener('keydown',e=>{if(e.key==='Escape'){hideSearch();}if(e.key==='ArrowDown'){e.preventDefault();$('search-results').querySelector('button')?.focus();}if(e.key==='Enter'){const b=$('search-results').querySelector('button');if(b){hideSearch();selectTopic(b.dataset.result);}}});document.addEventListener('click',e=>{if(!e.target.closest('.search'))hideSearch();});document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideSearch();closeReader();}if(e.key==='Tab'&&reader.getAttribute('aria-modal')==='true'){const focusables=[...reader.querySelectorAll('button:not([disabled]),a[href],input')].filter(el=>!el.hidden&&el.offsetParent!==null);const first=focusables[0],last=focusables[focusables.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
function route(initial=false){const hash=decodeURIComponent(location.hash.slice(1));const topic=TOPICS.find(t=>t.id===hash);if(topic){selectTopic(topic.id,!initial||matchMedia('(max-width:760px)').matches,false);return;}const m=hash.match(/^chapter-([23])(?:-group-([0-5]))?$/);if(m){setChapter(Number(m[1]));overview(m[2]===undefined?null:Number(m[2]),!initial&&m[2]!==undefined,false);}else{setChapter(2);overview(null,false,false);}}
window.addEventListener('popstate',()=>{closeReader();route();});let wasMobile=matchMedia('(max-width:760px)').matches;new ResizeObserver(()=>{const mobile=matchMedia('(max-width:760px)').matches;if(mobile!==wasMobile){wasMobile=mobile;drawMap();}if(fitMode)fit(fitMode==='all');if(!matchMedia('(max-width:760px)').matches){document.querySelector('.top').inert=false;document.querySelector('.map-section').inert=false;reader.removeAttribute('role');reader.removeAttribute('aria-modal');document.body.classList.remove('reading');}}).observe(viewport);route(true);
</script>
</body></html>
